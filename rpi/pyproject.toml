[project]
name = "wr-mechanisms"
version = "0.1.0"
description = "WINERED shutter + milky-flat diffuser WebSocket server for a Raspberry Pi (no PLC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Las Campanas Observatory" }]
# Base install is deliberately thin — `gpiozero` and its `lgpio` backend come
# from Raspberry Pi OS packages on the Pi (see deploy/install.sh), so the venv
# stays buildable on a laptop for sim runs and tests.
dependencies = [
    "websockets>=13.0",
]

[project.optional-dependencies]
gpio = [
    "gpiozero>=2.0",
    "lgpio>=0.2.2",
]

[project.scripts]
wr-mechanisms = "wr_mechanisms.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wr_mechanisms"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
