[project]
name = "adc-winered"
version = "0.1.0"
description = "Atmospheric Dispersion Corrector control server for WINERED (PLC + Python)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Las Campanas Observatory" }]
dependencies = [
    "pyads>=3.5.2",
    "websockets>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.scripts]
adc-winered = "adc_winered.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adc_winered"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
